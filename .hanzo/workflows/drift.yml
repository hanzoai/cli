name: Drift Gate

# THE QUESTION THIS JOB ASKS IS NOT THE ONE `cargo test` ASKS, and that is the
# whole reason it still exists.
#
# The gate itself — the command tree and the server held against each other in
# BOTH directions — is now HERMETIC: it rules on `spec/live.json`, the checked-in
# evidence, and runs inside `cargo test` on every push with no network at all.
# That was the fix for the oldest problem this pipeline had: a gate that needs the
# network in CI gets switched off, and a switched-off gate is worse than none.
#
# What no committed file can answer is whether PRODUCTION STILL SAYS SO. This
# drift is almost never introduced by a commit here — the route table moves when
# hanzoai/cloud deploys — so a repo that only checks itself when it changes learns
# about it at the next release, from a user. `make live-check` re-asks the running
# server, with a control for every probe, and fails when a VERDICT moved: not when
# a 401 became a 403 (the same fact about the same route, and a gate that goes red
# for that is a gate people learn to switch off), but when something present
# became absent, or absent became present, or a product appeared or vanished.
#
# The remedy it prints is one command: `make live`, commit `spec/live.json`, and
# read what the hermetic gate then says.
#
# WHY IT IS ITS OWN JOB. hanzo.yml's `test:` block runs inside hanzoai/ci's one
# lane, AFTER the client step (fetch the release document, refuse a moved ref),
# the KMS login and the toolchain provisioning. A job that runs last in a shared
# lane does not report on the server — it reports on everything ahead of it, and a
# failure anywhere upstream means the question is never asked at all. It was never
# asked once that way: at the moment this file was first rewritten, `drift.yml`
# had zero runs and the last three CI/CD runs on main were red.
#
# PUSH AND PULL_REQUEST ARE NOT TRIGGERS ANY MORE. On those, `cargo test` already
# rules on the evidence, hermetically, in hanzoai/ci's lane — so re-asking
# production on every push would add nothing except the power for somebody else's
# deploy to redden this repo's builds. The SCHEDULE is the half that matters, and
# `workflow_dispatch` is here so the answer is one click away when somebody asks
# "is the tree still true?" without pushing anything to find out.
#
# `release-matrix.yml` runs `make verify` — the hermetic gate — at the one moment
# the claim reaches users, before a single artifact is minted. That is not a
# duplicate of this job; it is the other question, at the moment it counts.
#
# `.hanzo/`, not `.github/`: the runners belong to git.hanzo.ai and github.com has
# none, so a pipeline under `.github/` queues forever instead of building.

on:
  schedule:
    - cron: '17 6 * * *'
  workflow_dispatch:

jobs:
  live:
    name: The live server still says what the committed evidence records
    runs-on: hanzo-build-linux-amd64
    steps:
      - uses: actions/checkout@v4
      # `toolchain: stable` is STATED, not inferred from the `@stable` ref.
      # dtolnay/rust-toolchain reads the branch name out of `github.action_ref`
      # to decide the toolchain — that is GitHub-runner behaviour, and act_runner
      # on our own forge does not reproduce it, so the action received an empty
      # input and failed with "'toolchain' is a required input".
      #
      # It only ever broke ONE target, which is why it looked like a linux-amd64
      # problem: linux-amd64 is the sole `host: true` entry, so it alone runs
      # `make test` -> the drift gate, and the gate's own workflow carried the
      # same step. Four targets shipped, the fifth did not, and the release
      # looked healthy while missing the only binary our own amd64 sandbox can
      # run.
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
      - run: make live-check

      # THE PIN MOVES BY PULLING, and this is the only thing that moves it.
      #
      # It used to be a push: hanzoai/cloud's release was meant to send
      # `repository_dispatch: spec-update` and hand this repo the document at the
      # sha it deployed. Nothing ever arrived. The CLI has no `.github/workflows`,
      # so GitHub recorded the event and ran nothing; the forge has no
      # repository_dispatch endpoint to send it to; and a push into this repo puts
      # hanzoai/ci's client lane in check-only at the LOCKED ref, so even a
      # delivered event could not have written a new one. Across 104 runs the pin
      # moved exactly once, by hand.
      #
      # So the side WITH runners asks. This job already has the network and the
      # toolchain and already runs nightly; reading one tag and regenerating costs
      # it one more step and needs no dispatch, no new secret and no second
      # mechanism. It runs even when `live-check` failed — production having moved
      # under the committed evidence is precisely when the pin wants moving.
      #
      # It OPENS A PATCH rather than pushing to main, because a re-pin is not
      # always safe to take: a tag exists the moment it is cut and production
      # deploys some time later, so a document can name a route the running server
      # does not serve yet — which the drift gate on the branch calls a phantom,
      # correctly. That is a wait, not a defect, and it needs a person.
      - name: Re-pin to hanzoai/cloud's newest release, and open the patch
        if: always()
        env:
          FORGE: https://git.hanzo.ai/v1
          TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          api() { curl -fsSL -H "Authorization: token $TOKEN" "$@"; }
          newest=$(api "$FORGE/repos/hanzoai/cloud/tags?limit=1" \
            | python3 -c 'import json,sys; print(json.load(sys.stdin)[0]["name"])')
          pinned=$(sed -n 's/^ref=//p' .spec-lock)
          if [ "$newest" = "$pinned" ]; then
            echo "the pin is hanzoai/cloud@$pinned, and that is the newest release"
            exit 0
          fi
          echo "hanzoai/cloud@$pinned -> @$newest"
          branch="spec/$newest"
          if api "$FORGE/repos/${{ github.repository }}/branches/$branch" >/dev/null 2>&1; then
            echo "$branch is already open — the patch is waiting on a person, not on this job"
            exit 0
          fi
          api "$FORGE/repos/hanzoai/cloud/raw/openapi.yaml?ref=$newest" -o /tmp/openapi.yaml
          printf 'ref=%s\nsha256=%s\nrepo=hanzoai/cloud\npath=openapi.yaml\n' \
            "$newest" "$(sha256sum /tmp/openapi.yaml | cut -d' ' -f1)" > .spec-lock
          # `make spec` fetches that ref AGAIN and refuses if the bytes moved under
          # the digest just written — the lock checking itself — then regenerates
          # the surface and re-captures the evidence in the same act.
          SPEC_TOKEN="$TOKEN" make spec
          git config user.name hanzo-dev
          git config user.email dev@hanzo.ai
          git switch -c "$branch"
          git commit -am "spec: re-pin to $newest"
          git push -u origin "$branch"
          python3 - "$branch" "$newest" <<'PY' > /tmp/pull.json
          import json, sys
          branch, ref = sys.argv[1], sys.argv[2]
          json.dump({
              "head": branch,
              "base": "main",
              "title": f"spec: re-pin to hanzoai/cloud@{ref}",
              "body": (
                  "The projection, moved forward to the newest release, with the "
                  "evidence re-captured in the same act.\n\n"
                  "`make verify` on this branch is the question worth reading. A "
                  "PHANTOM here means the tag is cut and production has not "
                  "deployed it yet, which is a wait rather than a defect: hold the "
                  "patch until the deploy lands and re-run.\n\n"
                  "Operation ids move freely between releases; CLI coordinates key "
                  "on (method, path) and do not."
              ),
          }, sys.stdout)
          PY
          api -X POST -H 'Content-Type: application/json' \
            "$FORGE/repos/${{ github.repository }}/pulls" -d @/tmp/pull.json >/dev/null
          echo "opened spec: re-pin to $newest"
