name: Drift Gate

# The command tree and the live server, held against each other in BOTH
# directions — a command whose route the server does not serve, and a served
# product no command reaches. `make verify` → `src/bin/driftgate.rs`.
#
# THIS FILE IS THE GATE'S ONLY HOME, and it owns all four ways of asking. It was
# split across two: a `drift` entry in hanzo.yml's `test:` list for pushes, and
# this file for the schedule. That is one predicate in two places, and the half in
# the shared lane could not answer.
#
# WHY IT MUST BE ITS OWN JOB. hanzo.yml's `test:` block runs inside hanzoai/ci's
# one lane, AFTER the client step (fetch the release document, refuse a moved ref),
# the KMS login and the toolchain provisioning. A gate that runs last in a shared
# job does not report on the server — it reports on everything ahead of it, and a
# failure anywhere upstream means the drift question is never asked at all. It was
# never asked: at the moment this file was rewritten, `drift.yml` had zero runs
# (the nightly had not come round yet) and the last three CI/CD runs on main were
# red. Ordering the gate before clippy fixed the smallest instance of a problem
# whose real shape is that a verdict must not share its fate with anything else.
#
# So the drift gate now needs exactly three things — a clone, a compiler and the
# network — and NOTHING in this job can fail for a reason that is not drift.
#
# The SCHEDULE is still the half that matters most: this drift is almost never
# introduced by a commit here. The route table moves when hanzoai/cloud deploys,
# and a repo that only checks itself when it changes learns about that at the next
# release, from a user. `workflow_dispatch` is here so the answer is one click away
# when somebody asks "is the tree still true?" without pushing anything to find out.
#
# The fourth ask lives in `release-matrix.yml` and is not a duplicate of this: it is
# the same `make verify` at the one moment the claim reaches users, before a single
# artifact is minted. Same command, four triggers, one implementation.
#
# `.hanzo/`, not `.github/`: the runners belong to git.hanzo.ai and github.com has
# none, so a pipeline under `.github/` queues forever instead of building.

on:
  push: { branches: [main] }
  pull_request:
  schedule:
    - cron: '17 6 * * *'
  workflow_dispatch:

jobs:
  drift:
    name: The live server contradicts this command tree in neither direction
    runs-on: hanzo-build-linux-amd64
    steps:
      - uses: actions/checkout@v4
      # `toolchain: stable` is STATED, not inferred from the `@stable` ref.
      # dtolnay/rust-toolchain reads the branch name out of `github.action_ref`
      # to decide the toolchain — that is GitHub-runner behaviour, and act_runner
      # on our own forge does not reproduce it, so the action received an empty
      # input and failed with "'toolchain' is a required input".
      #
      # It only ever broke ONE target, which is why it looked like a linux-amd64
      # problem: linux-amd64 is the sole `host: true` entry, so it alone runs
      # `make test` -> the drift gate, and the gate's own workflow carried the
      # same step. Four targets shipped, the fifth did not, and the release
      # looked healthy while missing the only binary our own amd64 sandbox can
      # run.
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
      - run: make verify
