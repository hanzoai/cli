# The canonical fleet pipeline, driven by this repo's root hanzo.yml. Every
# real detail lives there; this file is the trigger set and nothing else.
#
# It lives in `.hanzo/workflows/` because the runners are the FORGE's. The pool
# that answers `hanzo-build-linux-amd64` is registered to git.hanzo.ai;
# github.com has zero runners at any level. The forge reads BOTH
# `.hanzo/workflows` and `.github/workflows`, so a caller left under `.github/`
# runs twice — once here, and once on GitHub where nothing can ever pick it up
# and the job simply queues. `.hanzo/` is the half that runs.
#
# The `uses:` pin below names `.hanzo/workflows/build.yml`, which is where
# hanzoai/ci publishes the reusable and the only place it exists — the
# `.github/workflows` path this used to name is a 404 at v1. The forge resolves
# a reusable by name across its workflow directories, so the wrong path ran
# anyway; the pin is now true rather than merely lucky.
#
# `repository_dispatch: spec-update` used to be here, described as the coupling
# that carries a hanzoai/cloud release into this repo. It never carried one. The
# CLI has no `.github/workflows` at all, so GitHub recorded the event and ran
# nothing; the forge has no repository_dispatch endpoint to send it to; and the
# pin's whole history is one hand-typed commit against 104 runs. A trigger that
# is undeliverable in both directions is not a coupling, it is a story about one,
# so it is gone. The pin moves by PULLING, on the side that has runners —
# `.hanzo/workflows/drift.yml`, which already runs on a schedule with the network
# it needs.
name: CI/CD
on:
  push: { branches: [main] }
  pull_request:
  workflow_dispatch:
jobs:
  cicd:
    uses: hanzoai/ci/.hanzo/workflows/build.yml@v1.0.54
    secrets: inherit
