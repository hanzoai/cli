# Canonical CI config for hanzoai/cli — read by the hanzoai/ci reusable
# (.github/workflows/cicd.yml) and by platform.hanzo.ai. This repo had neither
# this file nor a Makefile, which is why `genspec` — the one thing that keeps
# the CLI's command surface honest — was reachable only by a maintainer typing
# it. A capture nothing re-asks goes stale silently, and this one did: it was
# 7 operations short and 8 operations wrong against the document cloud had
# already committed.
#
# NO images: the CLI is a binary a person installs, not a container a cluster
# runs. NO binaries: this repo's binaries are the five-target cross-build in
# .github/workflows/release-matrix.yml (cargo-zigbuild + a vendored macOS SDK) —
# that is genuinely per-repo build logic and it is already correct; the generic
# Go-shaped lane here cannot produce it. NO deploy: nothing here rolls out.
#
# What CI owns for this repo is the two gates below and the client lane.

client:
  # The document, by value at a pinned ref. hanzoai/cloud's release hands this
  # repo (version, sha, spec_sha256) once per release; the lane fetches
  # openapi.yaml AT THAT SHA, refuses on a digest mismatch, and writes
  # .spec-lock. Reading api.hanzo.ai here would name whatever is serving now
  # rather than the release that sent us.
  spec: { repo: hanzoai/cloud, path: openapi.yaml }
  generate: ./scripts/generate.sh
  # G3 — a spec change that produces a CLI that does not compile blocks the
  # release. `cargo test` is in it because the derivation gates live in tests/:
  # generated.rs must be exactly what spec/cloud.json derives, and the spec must
  # name a release. A regeneration that builds but breaks those has changed the
  # command tree out from under every user.
  build: cargo build --release --bin hanzo --locked && cargo test --locked
  # PATCH only, derived. The command surface is the document's; this crate only
  # restates it, so it never earns a minor or a major.
  version: "Cargo.toml:grep -m1 '^version' Cargo.toml | sed -E 's/.*\"(.*)\".*/\\1/'"

test:
  - name: spec-drift-check
    # THE D1 GATE. Re-fetch the document this tree names, prove the ref has not
    # moved under it (digest), and re-run the SAME derivation the writer runs —
    # refusing on any delta and writing nothing. A check that repairs what it
    # measures reports success for a tree that was wrong when the job started.
    #
    # It answers a different question from `verify` in release-matrix.yml, and
    # both have to hold: this one says the capture still equals its inputs, that
    # one says the running server still serves it.
    run: make spec-check
  - name: cargo-test
    run: cargo test --locked
  - name: clippy
    run: cargo clippy --locked --all-targets -- -D warnings
