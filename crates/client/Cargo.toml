[package]
name = "hanzo-client"
version = "0.1.1"
edition = "2021"
authors = ["Hanzo AI"]
description = "The Rust client for api.hanzo.ai — one credential scoped to one subject, held outcomes, typed errors"
license = "MIT"
repository = "https://github.com/hanzoai/cli"

[lib]
name = "hanzo_client"
path = "src/lib.rs"

[dependencies]
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"

[dev-dependencies]
tokio = { version = "1", features = ["rt", "macros"] }
