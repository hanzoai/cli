# The canonical fleet pipeline, driven by this repo's root hanzo.yml. Every
# real detail lives there; this file is the trigger set and nothing else.
#
# The runners are git.hanzo.ai's. The pool that answers `linux-amd64` is
# registered there; github.com has none at any level, so a job github.com picks
# up simply queues. Hanzo Git reads BOTH `.hanzo/workflows` and
# `.github/workflows`, and one directory serving both planes is why this sits
# under `.github/` now.
#
# The `uses:` pin names `.github/workflows/build.yml`, which is where hanzoai/ci
# publishes the reusable. Checked at tag v1 against a deliberately bogus path as
# the control: `.github/workflows/build.yml` resolves at 182,611 bytes and
# `.hanzo/workflows/build.yml` answers Not Found, identically to the control.
# The tag carries `.hanzo/workflows/cicd.yml` and no build.yml beside it.
#
# `repository_dispatch: spec-update` used to be here, described as the coupling
# that carries a hanzoai/cloud release into this repo. It never carried one. The
# CLI had no `.github/workflows` at the time, so GitHub recorded the event and ran
# nothing; Hanzo Git has no repository_dispatch endpoint to send it to; and the
# pin's whole history is one hand-typed commit against 104 runs. A trigger that
# is undeliverable in both directions is not a coupling, it is a story about one,
# so it is gone. The pin moves by PULLING, on the side that has runners —
# `.hanzo/workflows/drift.yml`, which already runs on a schedule with the network
# it needs.
name: CI/CD
on:
  push: { branches: [main] }
  pull_request:
  # A DISPATCH THAT NAMES NO DOCUMENT MOVES NOTHING. hanzoai/ci's client lane
  # moves this projection's pin only when handed a ref, and it read that from
  # `client_payload` -- which `repository_dispatch` populates and Hanzo Git does
  # not serve. So a bare poke re-read the LOCKED ref, asserted its digest and
  # exited before any write: every release could poke this forever and the pin
  # would never move.
  #
  # ci v1.0.75 takes the ref as an input. Omit it and this is a check that writes
  # nothing, exactly as before.
  workflow_dispatch:
    inputs:
      spec-ref:
        description: "cloud commit to move .spec-lock to. Empty = check the locked ref, write nothing."
        required: false
        default: ''
      spec-version:
        description: "Version to cut this projection at. Empty = derive the next patch."
        required: false
        default: ''
      spec-sha256:
        description: "Expected sha256 of openapi.yaml at that ref. Empty = do not verify."
        required: false
        default: ''
jobs:
  cicd:
    uses: hanzoai/ci/.github/workflows/build.yml@v1
    with:
      spec-ref: ${{ github.event.inputs.spec-ref || '' }}
      spec-version: ${{ github.event.inputs.spec-version || '' }}
      spec-sha256: ${{ github.event.inputs.spec-sha256 || '' }}
    secrets: inherit
