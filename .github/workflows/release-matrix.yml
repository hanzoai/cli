name: Release Matrix (CLI)

# Cross-platform `hanzo` binaries on OUR runners, published to the GitHub
# Release for the tag. NO GitHub-hosted builders — every target names a
# self-hosted scale set.
#
# Only `hanzo-build-linux-amd64` exists today (14 runners, one scale set). The
# macos-arm64 / linux-arm64 / windows-amd64 pools are NOT provisioned: naming
# them here queued the jobs forever and the whole matrix cancelled, which is why
# v1.0.0 and v1.1.0 tagged but never shipped a binary. Targets are added back as
# their pools come online — a target with no pool ships nothing and hides that
# it shipped nothing.

on:
  workflow_dispatch:
  push:
    tags: ['v[0-9]+.[0-9]+.[0-9]+']

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.target.id }}
    strategy:
      fail-fast: false
      matrix:
        target:
          - id: linux-amd64
            runner: hanzo-build-linux-amd64
    runs-on: ${{ matrix.target.runner }}
    steps:
      - uses: actions/checkout@v4
      # The ARC runner image is bare — no C toolchain at all ("linker `cc` not
      # found" on the first tag that ever reached a build). reqwest needs
      # OpenSSL, and keyring's sync-secret-service needs dbus.
      - name: System dependencies
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential pkg-config libssl-dev libdbus-1-dev
      - uses: dtolnay/rust-toolchain@stable
      # Tests GATE the artifact: an asset nobody tested is not a release. No
      # workflow had ever run cargo here, so 188 tests shipped unproven.
      - name: Test
        run: cargo test --bin hanzo --locked
      - name: Build
        run: cargo build --release --bin hanzo --locked
      - name: Package
        id: pkg
        run: |
          set -euo pipefail
          # The binary is `hanzo` (Cargo.toml [[bin]]), never `cli` — the old
          # glob matched nothing and `if-no-files-found: warn` hid it.
          test -x target/release/hanzo
          tar -czf "hanzo-${{ matrix.target.id }}.tar.gz" -C target/release hanzo
          sha256sum "hanzo-${{ matrix.target.id }}.tar.gz" > "hanzo-${{ matrix.target.id }}.tar.gz.sha256"
      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: hanzo-${{ matrix.target.id }}
          path: hanzo-${{ matrix.target.id }}.tar.gz*
          if-no-files-found: error

  publish:
    needs: build
    runs-on: hanzo-build-linux-amd64
    steps:
      - uses: actions/download-artifact@v4
        with: { path: dist, merge-multiple: true }
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          ls -l dist
          # Idempotent: a re-run must not fail on an existing release.
          if gh release view "${GITHUB_REF_NAME}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            gh release upload "${GITHUB_REF_NAME}" dist/* --repo "${GITHUB_REPOSITORY}" --clobber
          else
            gh release create "${GITHUB_REF_NAME}" dist/* \
              --repo "${GITHUB_REPOSITORY}" \
              --title "${GITHUB_REF_NAME}" \
              --generate-notes
          fi
